kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Reset password guidance
    modelDescription: Explains how to reset a Contoso password. Use when the user asks how to reset or unlock their password.
  actions:
    - kind: SendActivity
      id: sendHowTo
      activity: Open https://passwordreset.contoso.com and follow the steps.